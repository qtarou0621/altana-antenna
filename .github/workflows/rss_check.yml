name: Altana Antenna RSS Check

on:
  schedule:
    # 渋滞を避けるため「3分, 18分, 33分, 48分」にズラして15分おきに実行
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run RSS script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python rss_bot.py

      - name: Save state.json if updated
        run: |
          git config user.name "Altana Antenna Bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update RSS state"
          git push
