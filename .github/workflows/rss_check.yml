name: Altana Antenna RSS Check

on:
  schedule:
    # 15分おきに自動実行
    - cron: '*/15 * * * *'
  workflow_dispatch: # 手動テスト実行ボタンを有効化

permissions:
  contents: write # 既読ファイル(state.json)を上書き保存する権限

jobs:
  check-rss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run RSS script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python rss_bot.py

      - name: Save state.json if updated
        run: |
          git config user.name "Altana Antenna Bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update RSS state [skip ci]"
          git push
